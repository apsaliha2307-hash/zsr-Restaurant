<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Menu | AMORAL ZSR RESTAURANT</title>
  <link rel="stylesheet" href="style.css">
</head>

<body data-page="menu">

  <!-- HEADER -->
  <div id="header"></div>

  <!-- MENU -->
  <main class="menu-page">

    <section class="menu-hero">
  <div class="menu-hero-content">
    <p>DISCOVER OUR MENU</p>
    <h1>A Taste Worth <span>Remembering.</span></h1>
    <h4>Explore our handcrafted dishes and discover something delicious.</h4>
  </div>
</section>

    <section class="menu-tools">
      <input
        type="search"
        id="menu-search"
        placeholder="Search your favourite food..."
      >
      <div id="menu-filters"></div>
    </section>

    <section id="menu-grid" class="menu-grid"></section>

  </main>

  <!-- FOOTER -->
  <div id="footer"></div>

  <!-- JAVASCRIPT -->
  <script src="script.js"></script>

</body>
</html>
