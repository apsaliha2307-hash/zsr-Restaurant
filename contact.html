<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Amoral ZSR</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="contact">
  <div id="header"></div>

  <main>
    <section class="page-banner">
      <p class="eyebrow">WE WOULD LOVE TO HEAR FROM YOU</p>
      <h1>Let's Start a <span>Conversation.</span></h1>
      <p>Questions, celebrations or special requests — get in touch.</p>
    </section>

    <section class="section two-column">
  <div>
    <p class="eyebrow">GET IN TOUCH</p>
    <h2>We're Here <span>For You.</span></h2>
    <p><strong>Phone:</strong> +91 98423 76510</p>
    <p><strong>Email:</strong> contact@zrsrestaurant.in</p>
    <p><strong>Address:</strong> 142, High Road, Pernambut, Tamil Nadu 635810</p>
    <p><strong>Instagram:</strong> @zrs_restaurant</p>
  </div>

  <form id="contact-form" class="luxury-form">
    <label>Your Name
      <input name="name" required placeholder="Your name">
    </label>
    <label>Your Email
      <input name="email" type="email" required placeholder="Your email">
    </label>
    <label>Message
      <textarea name="message" rows="4" required placeholder="Write your message or reservation inquiry..."></textarea>
    </label>
    <button type="submit">Send Message</button>
  </form>
</section>
  </main>

  <div id="footer"></div>
  <script src="script.js"></script>
</body>
</html>
